<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畫HAPPENED</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .book-container {
            display: flex;
            width: 90vw;
            height: 80vh;
            max-width: 1400px;
            background: #2a2a2a;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .page {
            flex: 1;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            background: #252525;
        }
        .page-left {
            border-right: 1px solid #333;
            background: #222;
        }
        .page-right {
            background: #282828;
        }
        .image-content {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .image-content.active {
            display: block;
        }
        /* 封面模式：左頁隱藏，右頁撐滿 */
        .cover-mode .page-left {
            display: none;
        }
        .cover-mode .page-right {
            width: 100%;
            flex: none;
        }
        /* 提示字樣（沒圖時顯示） */
        .no-img-tip {
            position: absolute;
            color: #666;
            font-size: 1rem;
            pointer-events: none;
        }
        /* 導覽按鈕 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 20px 15px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.3s;
            z-index: 10;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .prev-btn { left: 10px; border-radius: 0 8px 8px 0; }
        .next-btn { right: 10px; border-radius: 8px 0 0 8px; }

        /* 頁碼顯示 */
        .page-counter {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
            z-index: 5;
        }

        /* ⚙️ 隱藏式控制面板 (滑鼠移到左下角才會顯現) */
        .admin-panel {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 100;
            width: 280px;
            opacity: 0.05;
            transition: opacity 0.3s ease;
        }
        .admin-panel:hover {
            opacity: 1.0;
        }
        .admin-panel h4 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #ffb74d;
            text-align: center;
        }
        .admin-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .admin-row select {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 3px;
            border-radius: 4px;
            width: 160px;
        }
        .file-input-wrapper {
            position: relative;
            width: 100%;
            margin-top: 10px;
        }
        .file-input-btn {
            display: block;
            width: 100%;
            background: #2e7d32;
            color: white;
            text-align: center;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .file-input-btn:hover { background: #1b5e20; }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0; top: 0; opacity: 0;
            width: 100%; height: 100%;
            cursor: pointer;
        }
        .clear-btn {
            display: block;
            width: 100%;
            background: #c62828;
            color: white;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 8px;
            border: none;
        }
        .clear-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <!-- 導覽按鈕 -->
    <button class="nav-btn prev-btn" onclick="changeSpread(-1)">&#10094;</button>

    <div class="book-container" id="bookContainer">
        <!-- 左頁 -->
        <div class="page page-left">
            <span class="no-img-tip" id="leftTip">暫無圖片</span>
            <img class="image-content" id="leftImage" src="" alt="左頁插畫">
        </div>
        <!-- 右頁 -->
        <div class="page page-right">
            <span class="no-img-tip" id="rightTip">暫無圖片</span>
            <img class="image-content" id="rightImage" src="" alt="右頁插畫">
        </div>
        <!-- 頁碼與作品名稱 -->
        <div class="page-counter" id="pageCounter">Cover</div>
    </div>

    <button class="nav-btn next-btn" onclick="changeSpread(1)">&#10095;</button>

    <!-- ⚙️ 圖片永久更新助手面版 -->
    <div class="admin-panel">
        <h4>🎨 18本書籍管理面板</h4>
        <div class="admin-row">
            <label>切換作品：</label>
            <select id="bookSelect" onchange="switchBook()">
                <!-- 自動生成 18 本書的選項 -->
            </select>
        </div>
        <div class="admin-row">
            <label>指定上傳位置：</label>
            <select id="pageSelect">
                <option value="0">0 - 獨立封面</option>
            </select>
        </div>
        <div class="file-input-wrapper">
            <div class="file-input-btn">選擇相片隨時更新替換</div>
            <input type="file" id="imageUploader" accept="image/*" onchange="uploadImage(this)">
        </div>
        <button class="clear-btn" onclick="clearCurrentBook()">清空當前書本所有圖片</button>
    </div>

    <script>
        const TOTAL_BOOKS = 18; // 補回 18 本書
        const TOTAL_INTERNAL_PAGES = 20; // 每本 20 頁
        let currentSpreadIdx = 0; 

        // 1. 自動動態生成 18 本書的下拉選單
        const bookSelect = document.getElementById('bookSelect');
        for (let b = 1; b <= TOTAL_BOOKS; b++) {
            let opt = document.createElement('option');
            opt.value = `book${b}`;
            opt.innerText = `第 ${b} 本作品`;
            bookSelect.appendChild(opt);
        }

        // 2. 初始化上傳選單的頁數選項 (0為封面，1~20為內頁)
        const pSelect = document.getElementById('pageSelect');
        for (let i = 1; i <= TOTAL_INTERNAL_PAGES; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${i} - 第 ${i} 頁`;
            pSelect.appendChild(opt);
        }

        // 切換書籍時
        function switchBook() {
            currentSpreadIdx = 0;
            renderSpread();
        }

        // 渲染畫面
        function renderSpread() {
            const bookKey = document.getElementById('bookSelect').value;
            const bookNum = bookKey.replace('book', '');
            const container = document.getElementById('bookContainer');
            const leftImg = document.getElementById('leftImage');
            const rightImg = document.getElementById('rightImage');
            const leftTip = document.getElementById('leftTip');
            const rightTip = document.getElementById('rightTip');
            const counter = document.getElementById('pageCounter');

            if (currentSpreadIdx === 0) {
                // 封面模式
                container.classList.add('cover-mode');
                counter.innerText = `第 ${bookNum} 本 — 封面`;
                
                const coverData = localStorage.getItem(`${bookKey}_page0`);
                if (coverData) {
                    rightImg.src = coverData;
                    rightImg.classList.add('active');
                    rightTip.style.display = 'none';
                } else {
                    rightImg.classList.remove('active');
                    rightTip.style.display = 'block';
                    rightTip.innerText = `第 ${bookNum} 本：尚未上傳封面 (Page 0)`;
                }
            } else {
                // 內頁模式（左右雙頁對開）
                container.classList.remove('cover-mode');
                
                const leftPageNum = (currentSpreadIdx - 1) * 2 + 1;
                const rightPageNum = leftPageNum + 1;
                
                counter.innerText = `第 ${bookNum} 本 — Page ${leftPageNum} - ${rightPageNum}`;

                // 左頁
                const leftData = localStorage.getItem(`${bookKey}_page${leftPageNum}`);
                if (leftData) {
                    leftImg.src = leftData;
                    leftImg.classList.add('active');
                    leftTip.style.display = 'none';
                } else {
                    leftImg.classList.remove('active');
                    leftTip.style.display = 'block';
                    leftTip.innerText = `第 ${leftPageNum} 頁 尚未上傳`;
                }

                // 右頁
                const rightData = localStorage.getItem(`${bookKey}_page${rightPageNum}`);
                if (rightData) {
                    rightImg.src = rightData;
                    rightImg.classList.add('active');
                    rightTip.style.display = 'none';
                } else {
                    rightImg.classList.remove('active');
                    rightTip.style.display = 'block';
                    rightTip.innerText = `第 ${rightPageNum} 頁 尚未上傳`;
                }
            }
        }

        // 翻頁
        function changeSpread(direction) {
            const maxSpreadIdx = TOTAL_INTERNAL_PAGES / 2; 
            currentSpreadIdx += direction;
            
            if (currentSpreadIdx < 0) currentSpreadIdx = 0;
            if (currentSpreadIdx > maxSpreadIdx) currentSpreadIdx = maxSpreadIdx;
            
            renderSpread();
        }

        // 上傳與永久保存圖片
        function uploadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const bookKey = document.getElementById('bookSelect').value;
                    const targetPageNum = document.getElementById('pageSelect').value;
                    
                    // 永久保存在瀏覽器的本地空間
                    localStorage.setItem(`${bookKey}_page${targetPageNum}`, e.target.result);
                    
                    // 自動跳轉到上傳的那一頁看效果
                    if (targetPageNum == 0) {
                        currentSpreadIdx = 0;
                    } else {
                        currentSpreadIdx = Math.ceil(parseInt(targetPageNum) / 2);
                    }
                    
                    renderSpread();
                    input.value = ''; 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 清空當前書籍
        function clearCurrentBook() {
            const bookKey = document.getElementById('bookSelect').value;
            const bookNum = bookKey.replace('book', '');
            if (confirm(`確定要清空「第 ${bookNum} 本作品」儲存的所有圖片嗎？`)) {
                for(let i=0; i<=TOTAL_INTERNAL_PAGES; i++) {
                    localStorage.removeItem(`${bookKey}_page${i}`);
                }
                currentSpreadIdx = 0;
                renderSpread();
            }
        }

        // 啟動
        renderSpread();
    </script>
</body>
</html>
