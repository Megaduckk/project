<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畫HAPPENED</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 📱 原本一進網站的 3×6 封面大目錄畫面 */
        .gallery-view {
            width: 100%;
            max-width: 1400px;
            padding: 40px 20px;
            display: block; /* 預設一進來就完整顯示 */
        }
        .gallery-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            color: #fff;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 完美的 6×3 橫向排列 */
            gap: 25px;
            width: 100%;
        }
        @media (max-width: 1200px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }
        .book-card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 3 / 4;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #333;
        }
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
            border-color: #555;
        }
        .card-cover-img {
            width: 100%;
            height: 85%;
            object-fit: cover; /* 讓原本的封面完美滿版 */
            background: #1a1a1a;
        }
        .card-title {
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            background: #252525;
            color: #ccc;
            font-weight: 500;
        }

        /* 📖 點進去後的單本翻頁閱讀畫面 (預設先隱藏) */
        .reader-view {
            display: none;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .back-to-gallery-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-to-gallery-btn:hover { background: rgba(255,255,255,0.3); }

        .book-container {
            display: flex;
            width: 90vw;
            height: 80vh;
            max-width: 1400px;
            background: #2a2a2a;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .page {
            flex: 1;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            background: #252525;
        }
        .page-left { border-right: 1px solid #333; background: #222; }
        .page-right { background: #282828; }
        
        .image-content {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .image-content.active { display: block; }
        
        .cover-mode .page-left { display: none; }
        .cover-mode .page-right { width: 100%; flex: none; }
        
        .no-img-tip {
            position: absolute;
            color: #666;
            font-size: 1rem;
            pointer-events: none;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 20px 15px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.3s;
            z-index: 10;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .prev-btn { left: 10px; border-radius: 0 8px 8px 0; }
        .next-btn { right: 10px; border-radius: 8px 0 0 8px; }

        .page-counter {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
            z-index: 5;
        }

        /* ⚙️ 隱藏式控制面板 (只有點進去預覽故事、且滑鼠移到左下角才會顯現) */
        .admin-panel {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 100;
            width: 280px;
            opacity: 0.01; /* 平時極度隱形 */
            transition: opacity 0.3s ease;
            display: none; /* 目錄畫面時不顯示 */
        }
        .admin-panel:hover { opacity: 1.0; }
        .admin-panel h4 { font-size: 0.9rem; margin-bottom: 10px; color: #ffb74d; text-align: center; }
        .admin-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.8rem; }
        .admin-row select { background: #333; color: white; border: 1px solid #555; padding: 3px; border-radius: 4px; width: 160px; }
        
        .file-input-wrapper { position: relative; width: 100%; margin-top: 10px; }
        .file-input-btn { display: block; width: 100%; background: #2e7d32; color: white; text-align: center; padding: 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .file-input-btn:hover { background: #1b5e20; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .clear-btn { display: block; width: 100%; background: #c62828; color: white; text-align: center; padding: 4px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 8px; border: none; }
        .clear-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <!-- 1️⃣ 3×6 封面大目錄視圖：原封不動保留你之前的精美封面結構 -->
    <div class="gallery-view" id="galleryView">
        <h1 class="gallery-title">HAPPENED — 畢業設計作品集</h1>
        <div class="grid-container" id="gridContainer">
            <!-- 這裡用 JS 完美生成原本的 18 本繪本卡片，並抓取你預設的封面檔名 -->
        </div>
    </div>

    <!-- 2️⃣ 單本繪本翻頁閱讀視圖（點進去預覽故事才會切換到這） -->
    <div class="reader-view" id="readerView">
        <button class="back-to-gallery-btn" onclick="showGallery()">← 返回目錄</button>
        <button class="nav-btn prev-btn" onclick="changeSpread(-1)">&#10094;</button>

        <div class="book-container" id="bookContainer">
            <div class="page page-left">
                <span class="no-img-tip" id="leftTip">暫無圖片</span>
                <img class="image-content" id="leftImage" src="" alt="左頁插畫">
            </div>
            <div class="page page-right">
                <span class="no-img-tip" id="rightTip">暫無圖片</span>
                <img class="image-content" id="rightImage" src="" alt="右頁插畫">
            </div>
            <div class="page-counter" id="pageCounter">Cover</div>
        </div>

        <button class="nav-btn next-btn" onclick="changeSpread(1)">&#10095;</button>
    </div>

    <!-- ⚙️ 圖片更新功能面板（只有進入內頁且滑鼠移到左下角才理它） -->
    <div class="admin-panel" id="adminPanel">
        <h4>🎨 當前繪本圖片更新</h4>
        <div class="admin-row">
            <label>目前操作：</label>
            <span id="adminCurrentBookLabel" style="font-size:0.85rem; color:#ffb74d; font-weight:bold;">第 1 本作品</span>
        </div>
        <div class="admin-row">
            <label>指定更新位置：</label>
            <select id="pageSelect">
                <!-- 由 JS 生成 1~20 頁的選項 -->
            </select>
        </div>
        <div class="file-input-wrapper">
            <div class="file-input-btn">選擇故事圖片隨時替換</div>
            <input type="file" id="imageUploader" accept="image/*" onchange="uploadImage(this)">
        </div>
        <button class="clear-btn" onclick="clearCurrentBook()">清空這本書的上傳圖片</button>
    </div>

    <script>
        const TOTAL_BOOKS = 18;
        const TOTAL_INTERNAL_PAGES = 20; // 支援每本 20 頁的故事內容
        let selectedBookKey = "book1";
        let currentSpreadIdx = 0; 

        // 🌟 請在這裡確認或修改你原本封面圖片的資料夾路徑與檔名格式！
        // 預設假設你的圖片放在同目錄，檔名是 cover1.jpg, cover2.jpg ... 
        // 如果你的資料夾叫 images/，可以改成 `images/cover${b}.jpg`
        function getOriginalCoverSrc(b) {
            return `cover${b}.jpg`; 
        }

        // 1. 初始化 3×6 的封面大目錄（保留你原本排好的樣子）
        const gridContainer = document.getElementById('gridContainer');
        for (let b = 1; b <= TOTAL_BOOKS; b++) {
            const key = `book${b}`;
            
            let card = document.createElement('div');
            card.className = 'book-card';
            card.onclick = function() { openBook(key); };
            
            // 封面優先使用你原本程式碼裡的靜態圖片，如果完全沒上傳過，就走預設路徑
            const originalCover = getOriginalCoverSrc(b);
            
            card.innerHTML = `
                <img class="card-cover-img" src="${originalCover}" onerror="this.src='https://via.placeholder.com/300x400/222/fff?text=Book+${b}'">
                <div class="card-title">第 ${b} 本數位繪本</div>
            `;
            gridContainer.appendChild(card);
        }

        // 2. 初始化建立內頁上傳的頁數下拉選單 (1~20 頁)
        const pSelect = document.getElementById('pageSelect');
        for (let i = 1; i <= TOTAL_INTERNAL_PAGES; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `第 ${i} 頁`;
            pSelect.appendChild(opt);
        }

        // 返回 3×6 總目錄畫面
        function showGallery() {
            document.getElementById('readerView').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'none'; // 隱藏面板
            document.getElementById('galleryView').style.display = 'block'; // 顯現大目錄
        }

        // 點擊 3×6 封面的其中一本，進入內頁故事預覽
        function openBook(bookKey) {
            selectedBookKey = bookKey;
            const bookNum = bookKey.replace('book', '');
            
            // 更新更新面板上的文字提示
            document.getElementById('adminCurrentBookLabel').innerText = `第 ${bookNum} 本作品`;
            
            currentSpreadIdx = 0; // 點進來先從「書本第一頁/封面」開始看起
            
            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('readerView').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'block'; // 進入內頁才開啟更新功能
            
            renderSpread();
        }

        // 渲染對開故事畫面
        function renderSpread() {
            const bookNum = selectedBookKey.replace('book', '');
            const container = document.getElementById('bookContainer');
            const leftImg = document.getElementById('leftImage');
            const rightImg = document.getElementById('rightImage');
            const leftTip = document.getElementById('leftTip');
            const rightTip = document.getElementById('rightTip');
            const counter = document.getElementById('pageCounter');

            if (currentSpreadIdx === 0) {
                // 封面預覽狀態：直接顯示你原本精美的原畫封面
                container.classList.add('cover-mode');
                counter.innerText = `第 ${bookNum} 本 — 封面`;
                
                rightImg.src = getOriginalCoverSrc(bookNum);
                rightImg.classList.add('active');
                rightTip.style.display = 'none';
                leftImg.classList.remove('active');
                leftTip.style.display = 'none';
            } else {
                // 進入內頁：左右雙頁對開（會優先讀取你隨時用按鈕上傳儲存的最新插畫）
                container.classList.remove('cover-mode');
                
                const leftPageNum = (currentSpreadIdx - 1) * 2 + 1;
                const rightPageNum = leftPageNum + 1;
                
                counter.innerText = `Book ${bookNum} — Page ${leftPageNum} - ${rightPageNum}`;

                // 【左頁】檢查有沒有上傳最新進度的圖
                const leftData = localStorage.getItem(`${selectedBookKey}_page${leftPageNum}`);
                if (leftData) {
                    leftImg.src = leftData;
                    leftImg.classList.add('active');
                    leftTip.style.display = 'none';
                } else {
                    leftImg.classList.remove('active');
                    leftTip.style.display = 'block';
                    leftTip.innerText = `第 ${leftPageNum} 頁故事尚未上傳`;
                }

                // 【右頁】檢查有沒有上傳最新進度的圖
                const rightData = localStorage.getItem(`${selectedBookKey}_page${rightPageNum}`);
                if (rightData) {
                    rightImg.src = rightData;
                    rightImg.classList.add('active');
                    rightTip.style.display = 'none';
                } else {
                    rightImg.classList.remove('active');
                    rightTip.style.display = 'block';
                    rightTip.innerText = `第 ${rightPageNum} 頁故事尚未上傳`;
                }
            }
        }

        // 翻頁功能
        function changeSpread(direction) {
            const maxSpreadIdx = TOTAL_INTERNAL_PAGES / 2; 
            currentSpreadIdx += direction;
            
            if (currentSpreadIdx < 0) currentSpreadIdx = 0;
            if (currentSpreadIdx > maxSpreadIdx) currentSpreadIdx = maxSpreadIdx;
            
            renderSpread();
        }

        // 點左下角上傳圖片，永久保留新進度
        function uploadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const targetPageNum = document.getElementById('pageSelect').value;
                    
                    // 永久存入瀏覽器
                    localStorage.setItem(`${selectedBookKey}_page${targetPageNum}`, e.target.result);
                    
                    // 自動翻到你剛上傳完的那一頁，讓你立刻檢查效果
                    currentSpreadIdx = Math.ceil(parseInt(targetPageNum) / 2);
                    
                    renderSpread();
                    input.value = ''; 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 清空當前書本內頁上傳的快取
        function clearCurrentBook() {
            const bookNum = selectedBookKey.replace('book', '');
            if (confirm(`確定要清除第 ${bookNum} 本書所有手動上傳的內頁圖片嗎？`)) {
                for(let i = 1; i <= TOTAL_INTERNAL_PAGES; i++) {
                    localStorage.removeItem(`${selectedBookKey}_page${i}`);
                }
                currentSpreadIdx = 0;
                renderSpread();
            }
        }
    </script>
</body>
</html>
