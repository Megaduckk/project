<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>畫HAPPENED</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 📱 3×6 封面總目錄畫面 */
        .gallery-view {
            width: 100%;
            max-width: 1400px;
            padding: 40px 20px;
            display: block;
        }
        .gallery-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            color: #fff;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr); /* 橫向 6 列 */
            gap: 25px;
            width: 100%;
        }
        @media (max-width: 1200px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); } /* 螢幕小變 3×6 */
        }
        .book-card {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            aspect-ratio: 3 / 4;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #333;
        }
        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255,255,255,0.1);
            border-color: #555;
        }
        .card-cover-img {
            width: 100%;
            height: 85%;
            object-fit: contain;
            background: #1a1a1a;
            display: none;
        }
        .card-cover-img.active {
            display: block;
        }
        .card-no-img {
            width: 100%;
            height: 85%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
            font-size: 0.9rem;
            background: #1a1a1a;
            text-align: center;
            padding: 10px;
        }
        .card-title {
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            background: #252525;
            color: #aaa;
            font-weight: 500;
        }

        /* 📖 單本繪本翻頁閱讀畫面 (初始隱藏) */
        .reader-view {
            display: none;
            width: 100vw;
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .back-to-gallery-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #444;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-to-gallery-btn:hover { background: rgba(255,255,255,0.3); }

        .book-container {
            display: flex;
            width: 90vw;
            height: 80vh;
            max-width: 1400px;
            background: #2a2a2a;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        .page {
            flex: 1;
            width: 50%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            background: #252525;
        }
        .page-left { border-right: 1px solid #333; background: #222; }
        .page-right { background: #282828; }
        
        .image-content {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
        .image-content.active { display: block; }
        
        .cover-mode .page-left { display: none; }
        .cover-mode .page-right { width: 100%; flex: none; }
        
        .no-img-tip {
            position: absolute;
            color: #666;
            font-size: 1rem;
            pointer-events: none;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 20px 15px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.3s;
            z-index: 10;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.3); }
        .prev-btn { left: 10px; border-radius: 0 8px 8px 0; }
        .next-btn { right: 10px; border-radius: 8px 0 0 8px; }

        .page-counter {
            position: absolute;
            bottom: 20px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #aaa;
            z-index: 5;
        }

        /* ⚙️ 隱藏式控制面板 (滑鼠移到左下角才會顯現) */
        .admin-panel {
            position: fixed;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 100;
            width: 280px;
            opacity: 0.05;
            transition: opacity 0.3s ease;
        }
        .admin-panel:hover { opacity: 1.0; }
        .admin-panel h4 { font-size: 0.9rem; margin-bottom: 10px; color: #ffb74d; text-align: center; }
        .admin-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 0.8rem; }
        .admin-row select { background: #333; color: white; border: 1px solid #555; padding: 3px; border-radius: 4px; width: 160px; }
        
        .file-input-wrapper { position: relative; width: 100%; margin-top: 10px; }
        .file-input-btn { display: block; width: 100%; background: #2e7d32; color: white; text-align: center; padding: 8px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
        .file-input-btn:hover { background: #1b5e20; }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        
        .clear-btn { display: block; width: 100%; background: #c62828; color: white; text-align: center; padding: 4px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 8px; border: none; }
        .clear-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <!-- 1️⃣ 3×6 封面大目錄視圖 -->
    <div class="gallery-view" id="galleryView">
        <h1 class="gallery-title">HAPPENED — 畢業設計作品集</h1>
        <div class="grid-container" id="gridContainer">
            <!-- 由 JS 自動產生 18 本書的格子 -->
        </div>
    </div>

    <!-- 2️⃣ 單本繪本翻頁閱讀視圖 -->
    <div class="reader-view" id="readerView">
        <button class="back-to-gallery-btn" onclick="showGallery()">← 返回目錄</button>
        <button class="nav-btn prev-btn" onclick="changeSpread(-1)">&#10094;</button>

        <div class="book-container" id="bookContainer">
            <div class="page page-left">
                <span class="no-img-tip" id="leftTip">暫無圖片</span>
                <img class="image-content" id="leftImage" src="" alt="左頁插畫">
            </div>
            <div class="page page-right">
                <span class="no-img-tip" id="rightTip">暫無圖片</span>
                <img class="image-content" id="rightImage" src="" alt="右頁插畫">
            </div>
            <div class="page-counter" id="pageCounter">Cover</div>
        </div>

        <button class="nav-btn next-btn" onclick="changeSpread(1)">&#10095;</button>
    </div>

    <!-- ⚙️ 圖片永久更新助手面版 -->
    <div class="admin-panel">
        <h4>🎨 18本書籍管理面板</h4>
        <div class="admin-row">
            <label>操作作品：</label>
            <select id="bookSelect" onchange="syncAdminSelect()">
                <!-- 自動生成 18 本書選項 -->
            </select>
        </div>
        <div class="admin-row">
            <label>指定上傳位置：</label>
            <select id="pageSelect">
                <option value="0">0 - 獨立封面 (目錄預覽)</option>
            </select>
        </div>
        <div class="file-input-wrapper">
            <div class="file-input-btn">選擇相片隨時更新替換</div>
            <input type="file" id="imageUploader" accept="image/*" onchange="uploadImage(this)">
        </div>
        <button class="clear-btn" onclick="clearCurrentBook()">清空當前書本所有圖片</button>
    </div>

    <script>
        const TOTAL_BOOKS = 18;
        const TOTAL_INTERNAL_PAGES = 20; 
        let selectedBookKey = "book1";
        let currentSpreadIdx = 0; 

        // 1. 初始化建立 18 本書的下拉選單與 3×6 目錄
        const bookSelect = document.getElementById('bookSelect');
        const gridContainer = document.getElementById('gridContainer');
        
        for (let b = 1; b <= TOTAL_BOOKS; b++) {
            const key = `book${b}`;
            
            // 填寫下拉選單
            let opt = document.createElement('option');
            opt.value = key;
            opt.innerText = `第 ${b} 本作品`;
            bookSelect.appendChild(opt);

            // 建立 3×6 的封面卡片
            let card = document.createElement('div');
            card.className = 'book-card';
            card.id = `card_${key}`;
            card.onclick = function() { openBook(key); };
            
            // 讀取本地儲存的封面 (Page 0)
            const localCover = localStorage.getItem(`${key}_page0`);
            
            card.innerHTML = `
                <img class="card-cover-img ${localCover ? 'active' : ''}" id="card_img_${key}" src="${localCover || ''}">
                <div class="card-no-img" id="card_tip_${key}" style="display: ${localCover ? 'none' : 'flex'}">第 ${b} 本作品<br><span style="font-size:0.75rem;color:#444;margin-top:5px;">(尚未上傳封面)</span></div>
                <div class="card-title">Book ${b}</div>
            `;
            gridContainer.appendChild(card);
        }

        // 2. 初始化建立 20 頁的頁數選單
        const pSelect = document.getElementById('pageSelect');
        for (let i = 1; i <= TOTAL_INTERNAL_PAGES; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `${i} - 第 ${i} 頁`;
            pSelect.appendChild(opt);
        }

        // 顯示總目錄畫面
        function showGallery() {
            document.getElementById('readerView').style.display = 'none';
            document.getElementById('galleryView').style.display = 'block';
            renderGalleryCovers(); // 返回時更新一下目錄封面
        }

        // 刷新大目錄上所有書本的封面圖
        function renderGalleryCovers() {
            for (let b = 1; b <= TOTAL_BOOKS; b++) {
                const key = `book${b}`;
                const localCover = localStorage.getItem(`${key}_page0`);
                const imgEl = document.getElementById(`card_img_${key}`);
                const tipEl = document.getElementById(`card_tip_${key}`);
                
                if (localCover) {
                    imgEl.src = localCover;
                    imgEl.classList.add('active');
                    tipEl.style.display = 'none';
                } else {
                    imgEl.classList.remove('active');
                    tipEl.style.display = 'flex';
                }
            }
        }

        // 點擊進入特定的繪本
        function openBook(bookKey) {
            selectedBookKey = bookKey;
            document.getElementById('bookSelect').value = bookKey;
            currentSpreadIdx = 0;
            
            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('readerView').style.display = 'flex';
            
            renderSpread();
        }

        // 控制面板切換書籍時，同步更新目前閱讀視窗
        function syncAdminSelect() {
            const adminBookKey = document.getElementById('bookSelect').value;
            if (document.getElementById('readerView').style.display === 'flex') {
                openBook(adminBookKey);
            } else {
                selectedBookKey = adminBookKey;
            }
        }

        // 渲染閱讀視窗內的雙頁畫面
        function renderSpread() {
            const bookNum = selectedBookKey.replace('book', '');
            const container = document.getElementById('bookContainer');
            const leftImg = document.getElementById('leftImage');
            const rightImg = document.getElementById('rightImage');
            const leftTip = document.getElementById('leftTip');
            const rightTip = document.getElementById('rightTip');
            const counter = document.getElementById('pageCounter');

            if (currentSpreadIdx === 0) {
                // 封面模式
                container.classList.add('cover-mode');
                counter.innerText = `第 ${bookNum} 本 — 封面`;
                
                const coverData = localStorage.getItem(`${selectedBookKey}_page0`);
                if (coverData) {
                    rightImg.src = coverData;
                    rightImg.classList.add('active');
                    rightTip.style.display = 'none';
                } else {
                    rightImg.classList.remove('active');
                    rightTip.style.display = 'block';
                    rightTip.innerText = `Book ${bookNum}：尚未上傳封面 (Page 0)`;
                }
            } else {
                // 內頁對開模式
                container.classList.remove('cover-mode');
                
                const leftPageNum = (currentSpreadIdx - 1) * 2 + 1;
                const rightPageNum = leftPageNum + 1;
                
                counter.innerText = `Book ${bookNum} — Page ${leftPageNum} - ${rightPageNum}`;

                // 左頁渲染
                const leftData = localStorage.getItem(`${selectedBookKey}_page${leftPageNum}`);
                if (leftData) {
                    leftImg.src = leftData;
                    leftImg.classList.add('active');
                    leftTip.style.display = 'none';
                } else {
                    leftImg.classList.remove('active');
                    leftTip.style.display = 'block';
                    leftTip.innerText = `第 ${leftPageNum} 頁 尚未上傳`;
                }

                // 右頁渲染
                const rightData = localStorage.getItem(`${selectedBookKey}_page${rightPageNum}`);
                if (rightData) {
                    rightImg.src = rightData;
                    rightImg.classList.add('active');
                    rightTip.style.display = 'none';
                } else {
                    rightImg.classList.remove('active');
                    rightTip.style.display = 'block';
                    rightTip.innerText = `第 ${rightPageNum} 頁 尚未上傳`;
                }
            }
        }

        // 閱讀器翻頁
        function changeSpread(direction) {
            const maxSpreadIdx = TOTAL_INTERNAL_PAGES / 2; 
            currentSpreadIdx += direction;
            
            if (currentSpreadIdx < 0) currentSpreadIdx = 0;
            if (currentSpreadIdx > maxSpreadIdx) currentSpreadIdx = maxSpreadIdx;
            
            renderSpread();
        }

        // 圖片上傳及永久保存
        function uploadImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const targetBookKey = document.getElementById('bookSelect').value;
                    const targetPageNum = document.getElementById('pageSelect').value;
                    
                    // 以 Base64 編碼格式永久保存在客端瀏覽器中
                    localStorage.setItem(`${targetBookKey}_page${targetPageNum}`, e.target.result);
                    
                    // 上傳成功後更新視圖
                    selectedBookKey = targetBookKey;
                    document.getElementById('galleryView').style.display = 'none';
                    document.getElementById('readerView').style.display = 'flex';
                    
                    if (targetPageNum == 0) {
                        currentSpreadIdx = 0;
                    } else {
                        currentSpreadIdx = Math.ceil(parseInt(targetPageNum) / 2);
                    }
                    
                    renderSpread();
                    renderGalleryCovers(); // 同步刷大目錄的圖片
                    input.value = ''; 
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // 清空書籍圖片
        function clearCurrentBook() {
            const targetBookKey = document.getElementById('bookSelect').value;
            const bookNum = targetBookKey.replace('book', '');
            if (confirm(`確定要清空「第 ${bookNum} 本作品」的所有儲存圖片嗎？`)) {
                for(let i = 0; i <= TOTAL_INTERNAL_PAGES; i++) {
                    localStorage.removeItem(`${targetBookKey}_page${i}`);
                }
                if (selectedBookKey === targetBookKey) {
                    currentSpreadIdx = 0;
                    renderSpread();
                }
                renderGalleryCovers();
            }
        }
    </script>
</body>
</html>
